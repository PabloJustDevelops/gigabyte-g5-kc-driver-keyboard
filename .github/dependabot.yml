version: 2

updates:
  # Frontend (React + Tailwind + Vite) — lockfile lives in gui/
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Rust core (Tauri)
  - package-ecosystem: cargo
    directory: /gui/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions themselves (workflow files in this repo)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
