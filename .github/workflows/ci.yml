name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  kernel:
    name: Kernel module build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headers for the runner kernel
        run: |
          sudo apt-get update
          # Prefer the exact running kernel's headers; fall back to the
          # generic metapackage if the pinned version has left the archive.
          sudo apt-get install -y "linux-headers-$(uname -r)" || \
            sudo apt-get install -y linux-headers-generic
          test -d "/lib/modules/$(uname -r)/build" || {
            echo "::error::no build tree for $(uname -r) (installed headers do not match the runner kernel)"
            exit 1
          }
      - name: Build g5kbd.ko
        run: make -C kernel

  python:
    name: Python CLI + shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile src/g5kbd.py tools/ec.py
      - name: CLI smoke test (fake backend, no hardware)
        run: G5KBD_FAKE=1 python src/g5kbd.py state
      - name: Shell syntax check
        run: bash -n install.sh probe-kb.sh probe-effects.sh systemd/system-sleep/g5kbd PKGBUILD
