name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          # What gpui-pre-platform needs to build and link on Linux: the X11
          # and Wayland client libraries (x11 + wayland features), their
          # xkbcommon counterparts, and pkg-config to find them. Vulkan is
          # loaded at runtime, so only the loader/headers are needed here.
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libvulkan-dev \
            libssl-dev \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  kernel:
    name: Kernel module build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install headers for the runner kernel
        run: |
          sudo apt-get update
          # Prefer the exact running kernel's headers; fall back to the
          # generic metapackage if the pinned version has left the archive.
          sudo apt-get install -y "linux-headers-$(uname -r)" || \
            sudo apt-get install -y linux-headers-generic
          test -d "/lib/modules/$(uname -r)/build" || {
            echo "::error::no build tree for $(uname -r) (installed headers do not match the runner kernel)"
            exit 1
          }
      - name: Report LED multicolor support in the target kernel
        run: |
          CFG="/lib/modules/$(uname -r)/build/.config"
          if [ -f "$CFG" ] && ! grep -qE '^CONFIG_LEDS_CLASS_MULTICOLOR=[ym]$' "$CFG"; then
            echo "::warning::runner kernel $(uname -r) has CONFIG_LEDS_CLASS_MULTICOLOR disabled — g5kbd cannot load there; the build below only gates compilation"
          else
            echo "CONFIG_LEDS_CLASS_MULTICOLOR is enabled (or .config unavailable) — full link check applies"
          fi
      - name: Build g5kbd.ko
        # KBUILD_MODPOST_WARN=1: distro header packages often lack the
        # module-export symbol table, so unresolved exports from kernels
        # without CONFIG_LEDS_CLASS_MULTICOLOR become warnings, not hard
        # errors. Compile errors still fail the job; real installs
        # (install.sh / PKGBUILD / DKMS) run strict modpost against the
        # full local kernel tree.
        run: make -C kernel KBUILD_MODPOST_WARN=1

  python:
    name: Python CLI + shell scripts
    runs-on: ubuntu-latest
    env:
      # Keep the fan CLI's fake backend/state out of the real paths; there is
      # no hardware and no /var/lib here.
      G5FAN_FAKE: "1"
      # The runner's DMI is not a Gigabyte G5, and g5fan refuses to touch an
      # EC it has not reverse-engineered. That is on purpose; here there is no
      # hardware at all, so the guard is what gets skipped.
      G5FAN_UNSAFE: "1"
      G5FAN_STATE: /tmp/g5fan-ci/state.json
      G5FAN_LOCK: /tmp/g5fan-ci/ec.lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile src/g5kbd.py src/g5fan.py tools/ec.py
      - name: Unit tests (curve maths, validation, rpm conversion)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests (fake backend, no hardware)
        run: |
          G5KBD_FAKE=1 python src/g5kbd.py state
          python src/g5fan.py status
          python src/g5fan.py turbo
          python src/g5fan.py curve set 50:25 65:40 75:60 85:80 95:100
          python src/g5fan.py silent
          python src/g5fan.py auto
      - name: Shell syntax check
        run: bash -n install.sh probe-kb.sh probe-effects.sh probe-fan.sh systemd/system-sleep/g5kbd PKGBUILD
