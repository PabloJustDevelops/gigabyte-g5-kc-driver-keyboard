name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  kernel:
    name: Kernel module build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install headers for the runner kernel
        run: |
          sudo apt-get update
          # Prefer the exact running kernel's headers; fall back to the
          # generic metapackage if the pinned version has left the archive.
          sudo apt-get install -y "linux-headers-$(uname -r)" || \
            sudo apt-get install -y linux-headers-generic
          test -d "/lib/modules/$(uname -r)/build" || {
            echo "::error::no build tree for $(uname -r) (installed headers do not match the runner kernel)"
            exit 1
          }
      - name: Report LED multicolor support in the target kernel
        run: |
          CFG="/lib/modules/$(uname -r)/build/.config"
          if [ -f "$CFG" ] && ! grep -qE '^CONFIG_LEDS_CLASS_MULTICOLOR=[ym]$' "$CFG"; then
            echo "::warning::runner kernel $(uname -r) has CONFIG_LEDS_CLASS_MULTICOLOR disabled — g5kbd cannot load there; the build below only gates compilation"
          else
            echo "CONFIG_LEDS_CLASS_MULTICOLOR is enabled (or .config unavailable) — full link check applies"
          fi
      - name: Build g5kbd.ko
        # KBUILD_MODPOST_WARN=1: distro header packages often lack the
        # module-export symbol table, so unresolved exports from kernels
        # without CONFIG_LEDS_CLASS_MULTICOLOR become warnings, not hard
        # errors. Compile errors still fail the job; real installs
        # (install.sh / PKGBUILD / DKMS) run strict modpost against the
        # full local kernel tree.
        run: make -C kernel KBUILD_MODPOST_WARN=1

  python:
    name: Python CLI + shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile src/g5kbd.py tools/ec.py
      - name: CLI smoke test (fake backend, no hardware)
        run: G5KBD_FAKE=1 python src/g5kbd.py state
      - name: Shell syntax check
        run: bash -n install.sh probe-kb.sh probe-effects.sh systemd/system-sleep/g5kbd PKGBUILD
