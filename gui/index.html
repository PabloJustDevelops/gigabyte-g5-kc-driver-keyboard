<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>g5kbd</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- ── header ─────────────────────────────────────────── -->
      <header class="top">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
          <div class="brand-text">
            <h1>g5kbd</h1>
            <p>Gigabyte G5 · keyboard backlight</p>
          </div>
        </div>
        <div id="backend-pill" class="pill" title="Backend in use">
          <span id="backend-dot" class="dot"></span><span id="backend-name">…</span>
        </div>
      </header>

      <!-- ── keyboard preview ──────────────────────────────── -->
      <section class="stage card">
        <div id="keyboard" class="keyboard">
          <div id="kb-rows" class="kb-rows"></div>
          <p class="caption">
            Preview
            <span id="fx-note" class="fx-note hidden">· approximating live effect</span>
          </p>
        </div>
      </section>

      <!-- ── colour ────────────────────────────────────────── -->
      <section class="card block">
        <h2>Colour</h2>
        <div id="swatches" class="swatches" role="group" aria-label="Colour presets"></div>
        <div class="rgb">
          <div class="rgb-row">
            <label class="rgb-label"><span class="ch red">R</span><span id="val-r">0</span></label>
            <input id="sl-r" class="rgb-slider red-slider" type="range" min="0" max="255" value="0" />
          </div>
          <div class="rgb-row">
            <label class="rgb-label"><span class="ch green">G</span><span id="val-g">0</span></label>
            <input id="sl-g" class="rgb-slider green-slider" type="range" min="0" max="255" value="0" />
          </div>
          <div class="rgb-row">
            <label class="rgb-label"><span class="ch blue">B</span><span id="val-b">0</span></label>
            <input id="sl-b" class="rgb-slider blue-slider" type="range" min="0" max="255" value="0" />
          </div>
        </div>
        <div class="hex-row">
          <span class="hex-hash">#</span>
          <input id="hex-input" class="hex-input" maxlength="6" spellcheck="false" aria-label="Hex colour" />
          <button id="hex-apply" class="btn ghost" type="button">apply</button>
        </div>
      </section>

      <!-- ── brightness / power ────────────────────────────── -->
      <section class="card block">
        <h2>Brightness</h2>
        <div class="bright-row">
          <input id="sl-bright" class="bright-slider" type="range" min="0" max="100" value="100" />
          <output id="bright-val" class="bright-val">100%</output>
          <button id="btn-power" class="btn switch" type="button" aria-pressed="true">on</button>
        </div>
      </section>

      <!-- ── effects ───────────────────────────────────────── -->
      <section class="card block">
        <div class="effect-head">
          <h2>Effects</h2>
          <p>host-driven animation · runs until stopped</p>
        </div>
        <div class="modes" role="group" aria-label="Effect mode">
          <button id="mode-breathe" class="mode" type="button">
            <span class="mode-name">Breathe</span>
            <span class="mode-desc">pulsing glow</span>
          </button>
          <button id="mode-cycle" class="mode" type="button">
            <span class="mode-name">Cycle</span>
            <span class="mode-desc">rainbow sweep</span>
          </button>
        </div>
        <div class="speed-row">
          <span class="speed-label">speed</span>
          <input id="sl-speed" class="bright-slider" type="range" min="1" max="10" value="5" />
          <output id="speed-val" class="bright-val">5</output>
        </div>
        <div class="action-row">
          <button id="btn-effect" class="btn primary" type="button" disabled>run breathe</button>
          <button id="btn-stop" class="btn danger" type="button" disabled>stop</button>
        </div>
      </section>

      <!-- ── status ────────────────────────────────────────── -->
      <footer id="status" class="status">ready</footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
