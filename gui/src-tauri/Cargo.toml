[package]
name = "g5kbd-gui"
version = "0.1.0"
description = "Gigabyte G5 keyboard backlight panel"
edition = "2021"

[lib]
name = "g5kbd_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used by `tauri build` so the release binary embeds the frontend instead
# of trying to reach the dev server. Plain `cargo build` omits it and
# produces a dev-URL binary ("Could not connect to localhost").
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
