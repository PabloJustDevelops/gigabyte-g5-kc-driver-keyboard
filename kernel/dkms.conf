PACKAGE_NAME="g5kbd"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="g5kbd"
DEST_MODULE_LOCATION[0]="/kernel/drivers/leds"
AUTOINSTALL="yes"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
# No CLEAN directive: it is deprecated (any value other than "true" warns),
# and dkms is unnecessary here — it builds in a throwaway copy of the tree
# and removes that directory itself. Keep /usr/src free of *.o/*.ko instead.
