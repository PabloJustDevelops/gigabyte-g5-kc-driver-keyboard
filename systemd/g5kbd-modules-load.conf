# Loaded at boot, in this order.
#
# g5kbd binds the G5's ACPI device (CLV0001 -> rgb:kbd) so the keyboard LEDs
# have a proper sysfs interface; the udev rule then grants the wheel group
# write access to it.
g5kbd

# The ACPI EC window g5fan reads duty, RPM and the temperatures through.
# `write_support=1` comes from /etc/modprobe.d/g5kbd.conf, which has to be in
# place before this runs.
ec_sys
