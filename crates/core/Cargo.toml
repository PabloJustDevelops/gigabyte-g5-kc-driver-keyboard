[package]
name = "g5core"
version = "0.4.0"
description = "Shared truth for the g5kbd panel, the g5kbd CLI and the g5fan daemon: the fan curve, the unit conversions, the EC register map and the on-disk state"
edition = "2024"
license = "MIT"

[dependencies]
# Enough for the whole product: JSON is the state/protocol format the CLIs and
# the panel already speak, and `libc` is only here for `flock` on the EC lock
# file and `kill(pid, 0)` on the effect pid file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
